<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0B1019">
<meta name="description" content="BandWatch - local network traffic monitor for OpenWrt">
<meta name="referrer" content="no-referrer">
<title>BandWatch</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/css/app.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="demo-banner" id="demo-banner" hidden role="note">Demo mode — all values on this dashboard are <b>simulated</b> and do not come from a real router.</div>
<div class="shell">
  <aside class="sidebar" aria-label="Primary">
    <a class="brand" id="brand" href="#/overview" aria-label="BandWatch overview"></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><span id="version"></span><span>Local · no telemetry</span></div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <h1 id="page-title">BandWatch</h1>
      <div class="top-actions">
        <span class="badge demo" id="demo-badge" hidden title="Values are generated by the built-in simulator">Simulated data</span>
        <span class="live-pill off" id="live-pill" role="status"><i></i>Connecting</span>
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Change theme"></button>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Sign out" title="Sign out" hidden></button>
      </div>
    </header>
    <main id="main" tabindex="-1"><div class="boot">Loading BandWatch…</div></main>
  </div>
</div>
<nav class="bottomnav" id="bottomnav" aria-label="Primary (mobile)"></nav>
<div id="login" class="login" hidden></div>
<div id="tip" class="chart-tip" hidden role="tooltip"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript><p class="noscript">BandWatch needs JavaScript enabled to display the dashboard.</p></noscript>
</body>
</html>
