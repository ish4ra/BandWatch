name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What problem would this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: The feature works locally without cloud services or telemetry
        - label: It does not require changing router configuration owned by other services
