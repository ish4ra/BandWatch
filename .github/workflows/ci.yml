name: CI

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest
      - name: Fetch the published beta.1 release (upgrade test)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/beta1" && cd "$RUNNER_TEMP/beta1"
          base=https://github.com/ish4ra/BandWatch/releases/download/v0.1.0-beta.1
          curl -fsSLO "$base/bandwatch-0.1.0-beta.1-openwrt.tar.gz"
          curl -fsSLO "$base/SHA256SUMS"
          grep ' bandwatch-0.1.0-beta.1-openwrt.tar.gz$' SHA256SUMS | sha256sum -c -
          echo "BW_BETA1_TARBALL=$RUNNER_TEMP/beta1/bandwatch-0.1.0-beta.1-openwrt.tar.gz" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -q

  lint-security:
    name: Lint and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff bandit
      - name: Ruff
        run: ruff check bandwatch scripts tests
      - name: Bandit (security linter)
        run: bandit -c pyproject.toml -r bandwatch scripts
      - name: ShellCheck (POSIX sh / BusyBox ash)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh --severity=warning scripts/*.sh scripts/pkg/* tests/openwrt/run.sh tests/openwrt/upgrade-beta1.sh \
            openwrt/bandwatch/files/usr/bin/bandwatch openwrt/bandwatch/files/etc/init.d/bandwatch \
            openwrt/luci-app-bandwatch/root/usr/libexec/rpcd/luci.bandwatch
      - name: Security-sensitive code checks
        run: sh scripts/ci-security-checks.sh

  frontend:
    name: Dashboard end-to-end tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: node tests/frontend/ui-test.js

  package:
    name: Build beta packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, lint-security]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build (tar.gz, ipk, apk v3)
        env:
          # Optional: maintainer's apk signing key (repository secret). When
          # absent (default, forks), packages are unsigned; checksums are
          # always published.
          SIGN_KEY_PEM: ${{ secrets.BANDWATCH_APK_SIGN_KEY_PEM }}
        run: |
          if [ -n "$SIGN_KEY_PEM" ]; then
            umask 077
            mkdir -p "$RUNNER_TEMP/apk-key"
            printf '%s\n' "$SIGN_KEY_PEM" > "$RUNNER_TEMP/apk-key/bandwatch.priv.pem"
            export BANDWATCH_APK_SIGN_KEY="$RUNNER_TEMP/apk-key/bandwatch.priv.pem"
          fi
          python scripts/build.py
      - name: Verify artefacts
        run: |
          set -e
          cd dist
          ls -la
          test -f bandwatch-*-openwrt.tar.gz
          test -f bandwatch_*_all.ipk && test -f luci-app-bandwatch_*_all.ipk
          test -f bandwatch-*.apk && test -f luci-app-bandwatch-*.apk
          sha256sum -c SHA256SUMS
          tar -tzf bandwatch-*-openwrt.tar.gz | grep -q install.sh
          docker run --rm -v "$PWD:/d:ro" alpine:edge sh -c 'apk adbdump /d/bandwatch-*.apk | head -20'
      - uses: actions/upload-artifact@v4
        with:
          name: bandwatch-beta
          path: |
            dist/*.tar.gz
            dist/*.ipk
            dist/*.apk
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: bandwatch-tester-bundle
          path: dist/*-tester-bundle.zip
          if-no-files-found: error
          retention-days: 30

  openwrt-integration:
    name: OpenWrt container test (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        tag: ["x86-64-25.12.0", "x86-64-24.10.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bandwatch-beta
          path: dist
      - name: Install, service, ACL, SSO, upgrade, rollback, uninstall
        run: sh tests/openwrt/run.sh "${{ matrix.tag }}"
      - name: Fetch the published beta.1 release assets
        run: |
          set -e
          mkdir -p beta1 && cd beta1
          base=https://github.com/ish4ra/BandWatch/releases/download/v0.1.0-beta.1
          for f in SHA256SUMS bandwatch-0.1.0-beta.1-openwrt.tar.gz bandwatch-0.1.0_beta1-r1.apk luci-app-bandwatch-0.1.0_beta1-r1.apk \
                   bandwatch_0.1.0-beta1-1_all.ipk luci-app-bandwatch_0.1.0-beta1-1_all.ipk; do curl -fsSLO "$base/$f"; done
          sha256sum -c --ignore-missing SHA256SUMS
      - name: Upgrade from the published beta.1 (installer and package manager), rollback, re-upgrade
        run: sh tests/openwrt/upgrade-beta1.sh "${{ matrix.tag }}" beta1

  luci-e2e:
    name: Real LuCI integration (OpenWrt 25.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [package]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bandwatch-beta
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: LuCI menu, SSO embed, new-tab sign-in, token replay
        run: sh tests/openwrt/luci.sh x86-64-25.12.0

  sdk-build:
    name: OpenWrt SDK feed build (25.12)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build bandwatch + luci-app-bandwatch from the local feed
        run: |
          mkdir -p sdk-out && chmod 777 sdk-out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sdk-out:/out" openwrt/sdk:x86-64-25.12.0 bash -c '
            cd /builder && echo "src-link bandwatch /src/openwrt" > feeds.conf &&
            ./scripts/feeds update bandwatch && ./scripts/feeds install -a -p bandwatch &&
            make defconfig >/dev/null &&
            make package/bandwatch/compile package/luci-app-bandwatch/compile &&
            cp bin/packages/*/bandwatch/*.apk /out/'
          ls -la sdk-out
          test -f sdk-out/bandwatch-0.1.0-r1.apk && test -f sdk-out/luci-app-bandwatch-0.1.0-r1.apk
