name: Firefox stall investigation

# Isolated reproduction for issue #2. Runs only when the reproduction itself
# changes (or on demand), so focused debugging does not re-run the whole CI.
# This job measures; it is not a required check and hides nothing: the full
# Firefox UI suite still runs (and must pass) in CI.

on:
  push:
    branches: ["claude/**"]
    paths:
      - "tests/firefox-repro/**"
      - "tests/frontend/ui-test.js"
      - ".github/workflows/firefox-investigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Stall reproduction (${{ matrix.browser }} run ${{ matrix.run }})
    # Rounds 1-3 are recorded in docs/archive/beta2-development-log.md; run again on demand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: firefox, run: 1 }
          - { browser: firefox, run: 2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run variants
        env:
          BROWSER: ${{ matrix.browser }}
          REPRO_ITER: "72"
          REPRO_BUDGET_MS: "600000"
          REPRO_STEP_TIMEOUT: "30000"
          REPRO_VARIANTS: "uitest-close-sw uitest-keepopen-prime-delay"
          REPRO_OUT: repro-${{ matrix.browser }}-${{ matrix.run }}.json
        run: node tests/firefox-repro/repro.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-${{ matrix.browser }}-${{ matrix.run }}
          path: repro-*.json
          retention-days: 14

  ui-repeat:
    # Repeatability check for a Firefox change in tests/frontend/ui-test.js:
    # the complete Firefox UI suite, several independent runs in parallel.
    name: Full Firefox UI suite (repeat ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        working-directory: tests/frontend
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps firefox
      - name: Run the Firefox UI suite
        env:
          BROWSER: firefox
        run: node tests/frontend/ui-test.js

  regular-firefox:
    # The runner image's own Firefox (not Playwright's patched build), driven
    # through geckodriver: new tab, navigated at once, every view, repeatedly.
    name: Regular Firefox via WebDriver (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install selenium
      - name: Load every view in new tabs (25 rounds)
        run: |
          firefox --version || true
          python tests/firefox-repro/regular_firefox.py 25
